<body class="bg-mesh min-h-screen text-slate-100 selection:bg-sky-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- INDEXEDDB HELPER ---
        const DB_NAME = "TenshiShinwaDB";
        const STORE_NAME = "card_images";
        const DB_VERSION = 1;

        const openDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
            });
        };

        const saveImageToIDB = async (key, dataUrl) => {
            try {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, "readwrite");
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.put(dataUrl, key);
                    request.onsuccess = () => resolve(true);
                    request.onerror = () => reject(request.error);
                });
            } catch (e) {
                console.error("IDB Save Error:", e);
                return false;
            }
        };

        const getImageFromIDB = async (key) => {
            try {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE_NAME, "readonly");
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.get(key);
                    request.onsuccess = () => resolve(request.result || null);
                    request.onerror = () => reject(request.error);
                });
            } catch (e) {
                console.error("IDB Get Error:", e);
                return null;
            }
        };

        const processImageFile = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_DIM = 1000;
                        if (width > height) {
                            if (width > MAX_DIM) {
                                height *= MAX_DIM / width;
                                width = MAX_DIM;
                            }
                        } else {
                            if (height > MAX_DIM) {
                                width *= MAX_DIM / height;
                                height = MAX_DIM;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.80);
                        resolve(dataUrl);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        };

        // --- DEFAULT DATA ---
        const DEFAULT_SITE_CONFIG = {
            title: "Tenshi Shinwa",
            subtitle: "Divine Anime Angel Card Collection & Album",
            adminPin: "1234",
            groupName: "Jlin Lut Group",
            groupLink: "https://t.me/"
        };

        const DEFAULT_ELEMENTS = [
            { id: 'light', name: 'Holy Light', icon: 'fa-sun', color: 'text-amber-300 bg-amber-950/60 border-amber-500/40' },
            { id: 'solar', name: 'Solar Flame', icon: 'fa-fire', color: 'text-orange-400 bg-orange-950/60 border-orange-500/40' },
            { id: 'cosmic', name: 'Cosmic Wind', icon: 'fa-wind', color: 'text-sky-300 bg-sky-950/60 border-sky-500/40' },
            { id: 'arcane', name: 'Arcane Wisdom', icon: 'fa-wand-magic-sparkles', color: 'text-purple-300 bg-purple-950/60 border-purple-500/40' },
            { id: 'twilight', name: 'Twilight Grace', icon: 'fa-moon', color: 'text-indigo-300 bg-indigo-950/60 border-indigo-500/40' }
        ];

        const DEFAULT_SERIES = [
            { id: 's1', name: 'Seraphim Dawn', description: 'The highest order of celestial beings emanating absolute divine light.', capacity: 50 },
            { id: 's2', name: 'Archangel Vanguard', description: 'Elite heavenly warriors wielding sacred armaments and wings of fire.', capacity: 50 },
            { id: 's3', name: 'Cherubim Sigils', description: 'Guardians of sacred celestial relics and arcane knowledge.', capacity: 50 }
        ];

        const DEFAULT_CARDS = [
            { id: 'c1', seriesId: 's1', number: 1, name: 'Seraphiel, Supreme Sovereign', rarity: 'Divine Rare', element: 'light', qty: 1, value: 150, image: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&q=80&w=600' },
            { id: 'c2', seriesId: 's1', number: 2, name: 'Celestia of the Morning Star', rarity: 'Mythic', element: 'light', qty: 2, value: 85, image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80&w=600' },
            { id: 'c3', seriesId: 's2', number: 1, name: 'Michaelis, Blade of Dawn', rarity: 'Ultra Rare', element: 'solar', qty: 1, value: 95, image: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&q=80&w=600' },
        ];

        const RARITIES = [
            { name: 'Common', color: 'bg-slate-700 text-slate-200 border-slate-500' },
            { name: 'Uncommon', color: 'bg-emerald-950 text-emerald-300 border-emerald-500' },
            { name: 'Rare', color: 'bg-blue-950 text-blue-300 border-blue-500' },
            { name: 'Ultra Rare', color: 'bg-purple-950 text-purple-300 border-purple-500' },
            { name: 'Mythic', color: 'bg-amber-950 text-amber-300 border-amber-500' },
            { name: 'Divine Rare', color: 'bg-rose-950 text-rose-300 border-rose-500 shadow-[0_0_15px_rgba(244,63,94,0.4)]' }
        ];

        function App() {
            const [isAdmin, setIsAdmin] = useState(false);
            const [showPinModal, setShowPinModal] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [siteConfig, setSiteConfig] = useState(() => {
                const saved = localStorage.getItem('ts_config');
                return saved ? JSON.parse(saved) : DEFAULT_SITE_CONFIG;
            });
            const [seriesList, setSeriesList] = useState(() => {
                const saved = localStorage.getItem('ts_series');
                return saved ? JSON.parse(saved) : DEFAULT_SERIES;
            });
            const [elements, setElements] = useState(() => {
                const saved = localStorage.getItem('ts_elements');
                return saved ? JSON.parse(saved) : DEFAULT_ELEMENTS;
            });
            const [cards, setCards] = useState(() => {
                const saved = localStorage.getItem('ts_cards');
                return saved ? JSON.parse(saved) : DEFAULT_CARDS;
            });
            const [imageMap, setImageMap] = useState({});

            const [currentView, setCurrentView] = useState('shelf');
            const [selectedSeriesId, setSelectedSeriesId] = useState(null);

            const [searchQuery, setSearchQuery] = useState('');
            const [filterRarity, setFilterRarity] = useState('ALL');
            const [filterElement, setFilterElement] = useState('ALL');
            const [viewMode, setViewMode] = useState('grid');

            const [inspectCard, setInspectCard] = useState(null);
            const [editingCard, setEditingCard] = useState(null);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);

            const [showCameraModal, setShowCameraModal] = useState(false);
            const videoRef = useRef(null);
            const [cameraStream, setCameraStream] = useState(null);

            useEffect(() => {
                localStorage.setItem('ts_config', JSON.stringify(siteConfig));
            }, [siteConfig]);
            useEffect(() => {
                localStorage.setItem('ts_series', JSON.stringify(seriesList));
            }, [seriesList]);
            useEffect(() => {
                localStorage.setItem('ts_elements', JSON.stringify(elements));
            }, [elements]);
            useEffect(() => {
                localStorage.setItem('ts_cards', JSON.stringify(cards));
            }, [cards]);

            useEffect(() => {
                cards.forEach(async (c) => {
                    if (c && c.id) {
                        const img = await getImageFromIDB(c.id);
                        if (img) {
                            setImageMap(prev => ({ ...prev, [c.id]: img }));
                        }
                    }
                });
            }, []);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (pinInput === siteConfig.adminPin) {
                    setIsAdmin(true);
                    setShowPinModal(false);
                    setPinInput('');
                } else {
                    alert('Incorrect Admin Passcode!');
                }
            };

            const handleGroupClick = (e) => {
                if (isAdmin) {
                    e.preventDefault();
                    const newLink = prompt("Enter Group URL Link:", siteConfig.groupLink);
                    if (newLink) {
                        const newName = prompt("Enter Group Button Name:", siteConfig.groupName);
                        setSiteConfig(prev => ({ ...prev, groupLink: newLink, groupName: newName || prev.groupName }));
                    }
                } else {
                    window.open(siteConfig.groupLink, '_blank');
                }
            };

            const startCamera = async () => {
                setShowCameraModal(true);
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    setCameraStream(stream);
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                    }
                } catch (err) {
                    console.error("Camera error:", err);
                    alert("Unable to access camera.");
                    setShowCameraModal(false);
                }
            };

            const stopCamera = () => {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                    setCameraStream(null);
                }
                setShowCameraModal(false);
            };

            const captureCameraPhoto = () => {
                const video = videoRef.current;
                if (!video) return;
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.80);
                stopCamera();
                return dataUrl;
            };

            const handleSaveCard = async (e) => {
                e.preventDefault();
                const form = e.target;
                const cardId = editingCard.id || `card_${Date.now()}`;
                const seriesId = editingCard.seriesId;
                const number = parseInt(form.number.value);
                const name = form.name.value;
                const rarity = form.rarity.value;
                const element = form.element.value;
                const qty = parseInt(form.qty.value) || 0;
                const value = parseFloat(form.value.value) || 0;

                let imageVal = editingCard.image || '';
                const fileInput = form.imageFile;
                const urlInput = form.imageUrl ? form.imageUrl.value.trim() : '';

                if (urlInput) {
                    imageVal = urlInput;
                } else if (fileInput && fileInput.files && fileInput.files[0]) {
                    try {
                        const compressed = await processImageFile(fileInput.files[0]);
                        imageVal = compressed;
                        await saveImageToIDB(cardId, compressed);
                        setImageMap(prev => ({ ...prev, [cardId]: compressed }));
                    } catch (err) {
                        console.error(err);
                    }
                }

                const newCardObj = {
                    id: cardId,
                    seriesId,
                    number,
                    name,
                    rarity,
                    element,
                    qty,
                    value,
                    image: imageVal
                };

                setCards(prev => {
                    const idx = prev.findIndex(c => c.id === cardId);
                    if (idx >= 0) {
                        const copy = [...prev];
                        copy[idx] = newCardObj;
                        return copy;
                    } else {
                        return [...prev, newCardObj];
                    }
                });

                setEditingCard(null);
            };

            const handleDeleteCard = (cardId) => {
                if (confirm("Are you sure you want to delete this card?")) {
                    setCards(prev => prev.filter(c => c.id !== cardId));
                    setEditingCard(null);
                }
            };

            // EXPORT / IMPORT BACKUP DATA
            const exportBackup = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
                    siteConfig,
                    seriesList,
                    elements,
                    cards
                }));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `tenshi_shinwa_backup_${Date.now()}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const importBackup = (e) => {
                const fileReader = new FileReader();
                fileReader.readAsText(e.target.files[0], "UTF-8");
                fileReader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.cards) setCards(parsed.cards);
                        if (parsed.seriesList) setSeriesList(parsed.seriesList);
                        if (parsed.elements) setElements(parsed.elements);
                        if (parsed.siteConfig) setSiteConfig(parsed.siteConfig);
                        alert("Collection backup restored successfully!");
                        setIsSettingsOpen(false);
                    } catch (err) {
                        alert("Invalid backup file!");
                    }
                };
            };

            const currentSeries = seriesList.find(s => s.id === selectedSeriesId);
            const seriesCards = currentView === 'album' 
                ? cards.filter(c => c.seriesId === selectedSeriesId)
                : cards;

            const totalPortfolioValue = cards.reduce((acc, c) => acc + (c.value * (c.qty || 0)), 0);
            const totalCardsCount = cards.reduce((acc, c) => acc + (c.qty || 0), 0);

            return (
                <div className="min-h-screen text-slate-100 flex flex-col relative pb-20">
                    <div className="absolute inset-0 overflow-hidden pointer-events-none z-0 opacity-20">
                        <div className="absolute top-10 left-10 w-96 h-96 bg-purple-600 rounded-full blur-[120px] animate-pulse-slow"></div>
                        <div className="absolute bottom-20 right-10 w-96 h-96 bg-sky-500 rounded-full blur-[140px] animate-pulse-slow"></div>
                    </div>

                    <header className="relative z-20 border-b border-slate-800 bg-cosmic-900/80 backdrop-blur-md sticky top-0 px-4 py-3 flex items-center justify-between shadow-lg">
                        <div className="flex items-center space-x-3">
                            <button 
                                onClick={handleGroupClick}
                                className="group flex items-center space-x-2 bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-medium px-3.5 py-2 rounded-xl shadow-glow transition-all duration-300 text-sm"
                            >
                                <i className="fa-solid fa-users text-amber-300"></i>
                                <span className="font-cinzel tracking-wider">{siteConfig.groupName}</span>
                                {isAdmin && <i className="fa-solid fa-pen text-xs opacity-70 ml-1"></i>}
                            </button>

                            {currentView === 'album' && (
                                <button 
                                    onClick={() => { setCurrentView('shelf'); setSelectedSeriesId(null); }}
                                    className="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl text-sm transition-all"
                                >
                                    <i className="fa-solid fa-arrow-left"></i>
                                    <span>Back to Albums</span>
                                </button>
                            )}
                        </div>

                        <div className="text-center cursor-pointer" onClick={() => { setCurrentView('shelf'); setSelectedSeriesId(null); }}>
                            <h1 className="text-xl md:text-2xl font-black font-cinzel bg-gradient-to-r from-amber-200 via-sky-300 to-purple-300 bg-clip-text text-transparent drop-shadow-md">
                                {siteConfig.title}
                            </h1>
                            <p className="text-xs text-slate-400 hidden sm:block tracking-widest">{siteConfig.subtitle}</p>
                        </div>

                        <div className="flex items-center space-x-2">
                            {isAdmin ? (
                                <div className="flex items-center space-x-2">
                                    <span className="hidden md:inline-block text-xs bg-emerald-950 text-emerald-400 border border-emerald-500/40 px-2.5 py-1 rounded-full">
                                        <i className="fa-solid fa-shield-halved mr-1"></i> Admin Active
                                    </span>
                                    <button 
                                        onClick={() => setIsSettingsOpen(true)}
                                        className="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-xl text-amber-300 transition-all"
                                    >
                                        <i className="fa-solid fa-gear"></i>
                                    </button>
                                    <button 
                                        onClick={() => setIsAdmin(false)}
                                        className="bg-rose-950/80 hover:bg-rose-900 text-rose-300 px-3 py-2 rounded-xl text-xs font-semibold transition-all border border-rose-500/30"
                                    >
                                        Logout
                                    </button>
                                </div>
                            ) : (
                                <button 
                                    onClick={() => setShowPinModal(true)}
                                    className="flex items-center space-x-1.5 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white px-3.5 py-2 rounded-xl text-xs font-medium transition-all border border-slate-700"
                                >
                                    <i className="fa-solid fa-lock"></i>
                                    <span>Admin Login</span>
                                </button>
                            )}
                        </div>
                    </header>

                    <main className="relative z-10 flex-1 max-w-7xl w-full mx-auto px-4 py-6">
                        {currentView === 'shelf' ? (
                            <div>
                                <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4 bg-cosmic-800/50 p-6 rounded-2xl border border-slate-700/60 backdrop-blur-md">
                                    <div>
                                        <div className="flex items-center space-x-3">
                                            <h2 className="text-2xl md:text-3xl font-bold font-cinzel text-amber-200">Celestial Album Binder</h2>
                                            {isAdmin && (
                                                <button 
                                                    onClick={() => {
                                                        const name = prompt("Enter new Series Name:");
                                                        if (name) {
                                                            const desc = prompt("Enter description:", "Divine anime angelic collection series");
                                                            const cap = parseInt(prompt("Enter card capacity (1-500):", "50")) || 50;
                                                            const newId = `s_${Date.now()}`;
                                                            setSeriesList(prev => [...prev, { id: newId, name, description: desc, capacity: cap }]);
                                                        }
                                                    }}
                                                    className="bg-amber-500 hover:bg-amber-400 text-cosmic-900 font-bold px-3 py-1.5 rounded-lg text-xs flex items-center space-x-1 transition-all shadow-gold-glow"
                                                >
                                                    <i className="fa-solid fa-plus"></i><span>New Series Album</span>
                                                </button>
                                            )}
                                        </div>
                                        <p className="text-slate-400 text-sm mt-1">Select a series album below to inspect, manage, and view cards.</p>
                                    </div>
                                    <div className="flex items-center space-x-4 bg-cosmic-900/80 px-4 py-3 rounded-xl border border-slate-800 text-sm">
                                        <div>
                                            <span className="text-slate-400 block text-xs">Total Cards</span>
                                            <span className="text-lg font-bold text-sky-300">{totalCardsCount}</span>
                                        </div>
                                        <div className="h-8 w-[1px] bg-slate-800"></div>
                                        <div>
                                            <span className="text-slate-400 block text-xs">Portfolio Value</span>
                                            <span className="text-lg font-bold text-amber-300">${totalPortfolioValue.toLocaleString()}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {seriesList.map((series) => {
                                        const sCards = cards.filter(c => c.seriesId === series.id);
                                        const coverCard = sCards.find(c => imageMap[c.id] || c.image);
                                        const coverImg = coverCard ? (imageMap[coverCard.id] || coverCard.image) : null;

                                        return (
                                            <div 
                                                key={series.id}
                                                onClick={() => { setSelectedSeriesId(series.id); setCurrentView('album'); }}
                                                className="group relative bg-gradient-to-b from-cosmic-800 to-cosmic-900 rounded-2xl border border-slate-700/80 p-6 shadow-xl hover:shadow-glow hover:border-sky-500/50 transition-all duration-300 cursor-pointer overflow-hidden flex flex-col justify-between"
                                            >
                                                <div className="absolute -top-12 -right-12 w-32 h-32 bg-sky-500/10 rounded-full blur-2xl group-hover:bg-sky-500/20 transition-all"></div>
                                                <div>
                                                    <div className="flex items-start justify-between mb-4">
                                                        <div className="w-16 h-20 rounded-lg bg-slate-800 border border-slate-700 overflow-hidden flex items-center justify-center shadow-md relative">
                                                            {coverImg ? (
                                                                <img src={coverImg} alt={series.name} className="w-full h-full object-cover" />
                                                            ) : (
                                                                <i className="fa-solid fa-book-bookmark text-sky-400 text-xl"></i>

                                <div className="flex space-x-3 mt-4 w-full">
                                    <button 
                                        type="button" 
                                        onClick={stopCamera}
                                        className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-xs font-semibold"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={() => {
                                            const dataUrl = captureCameraPhoto();
                                            if (dataUrl && editingCard) {
                                                const cardId = editingCard.id || `card_${Date.now()}`;
                                                saveImageToIDB(cardId, dataUrl);
                                                setImageMap(prev => ({ ...prev, [cardId]: dataUrl }));
                                                setEditingCard(prev => ({ ...prev, image: dataUrl, id: cardId }));
                                            }
                                        }}
                                        className="flex-1 bg-purple-600 hover:bg-purple-500 text-white py-2.5 rounded-xl text-xs font-bold shadow-glow"
                                    >
                                        Capture
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isSettingsOpen && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-cosmic-800 border border-amber-500/50 rounded-3xl max-w-md w-full p-6 shadow-glow relative max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-bold font-cinzel text-amber-200">Admin Control Center</h3>
                                    <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-white">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <div className="space-y-4 text-sm">
                                    <div className="bg-cosmic-900/60 p-4 rounded-2xl border border-slate-800 space-y-3">
                                        <h4 className="font-semibold text-amber-300 text-xs uppercase tracking-wider">Backup & Restore Collection</h4>
                                        <div className="flex gap-2">
                                            <button 
                                                onClick={exportBackup} 
                                                className="flex-1 bg-sky-600 hover:bg-sky-500 text-white py-2 rounded-xl text-xs font-bold"
                                            >
                                                Export Backup (.json)
                                            </button>
                                            <label className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded-xl text-xs font-bold text-center cursor-pointer border border-slate-700">
                                                Restore Backup
                                                <input type="file" accept=".json" onChange={importBackup} className="hidden" />
                                            </label>
                                        </div>
                                    </div>

                                    <div className="bg-cosmic-900/60 p-4 rounded-2xl border border-slate-800 space-y-3">
                                        <h4 className="font-semibold text-amber-300 text-xs uppercase tracking-wider">Manage Elements / Attributes</h4>
                                        <div className="space-y-2 max-h-40 overflow-y-auto pr-1">
                                            {elements.map(el => (
                                                <div key={el.id} className="flex items-center justify-between bg-cosmic-800 p-2 rounded-xl border border-slate-700 text-xs">
                                                    <span className={`px-2 py-0.5 rounded border flex items-center space-x-1 ${el.color}`}>
                                                        <i className={`fa-solid ${el.icon}`}></i>
                                                        <span>{el.name}</span>
                                                    </span>
                                                    <button 
                                                        onClick={() => {
                                                            if (elements.length <= 1) {
                                                                alert("You must keep at least one element!");
                                                                return;
                                                            }
                                                            if (confirm(`Delete element "${el.name}"?`)) {
                                                                setElements(prev => prev.filter(e => e.id !== el.id));
                                                            }
                                                        }}
                                                        className="text-rose-400 hover:text-rose-300 px-2 py-1"
                                                    >
                                                        <i className="fa-solid fa-trash"></i>
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                        <button 
                                            onClick={() => {
                                                const name = prompt("Enter new Element Name (e.g. Celestial Void):");
                                                if (name) {
                                                    const id = `el_${Date.now()}`;
                                                    const icon = prompt("Enter FontAwesome icon class (e.g. fa-star, fa-bolt, fa-shield):", "fa-star");
                                                    const newEl = { id, name, icon: icon || 'fa-star', color: 'text-purple-300 bg-purple-950/60 border-purple-500/40' };
                                                    setElements(prev => [...prev, newEl]);
                                                }
                                            }}
                                            className="w-full bg-purple-600 hover:bg-purple-500 text-white py-2 rounded-xl text-xs font-bold"
                                        >
                                            + Add New Element
                                        </button>
                                    </div>

                                    <div className="bg-cosmic-900/60 p-4 rounded-2xl border border-slate-800 space-y-3">
                                        <h4 className="font-semibold text-amber-300 text-xs uppercase tracking-wider">Change Admin Passcode</h4>
                                        <form onSubmit={(e) => {
                                            e.preventDefault();
                                            const newPin = e.target.newPin.value;
                                            if (newPin) {
                                                setSiteConfig(prev => ({ ...prev, adminPin: newPin }));
                                                alert("Admin Passcode successfully updated!");
                                                setIsSettingsOpen(false);
                                            }
                                        }} className="flex gap-2">
                                            <input 
                                                type="password" 
                                                name="newPin" 
                                                placeholder="New 4-digit PIN" 
                                                required 
                                                className="flex-1 bg-cosmic-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
                                            />
                                            <button type="submit" className="bg-amber-500 hover:bg-amber-400 text-cosmic-900 px-4 py-2 rounded-xl font-bold text-xs">
                                                Update PIN
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showPinModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-cosmic-800 border border-sky-500/50 rounded-3xl max-w-xs w-full p-6 shadow-glow text-center">
                                <div className="w-12 h-12 rounded-2xl bg-sky-950 border border-sky-500/40 mx-auto flex items-center justify-center mb-4 text-sky-400 text-xl">
                                    <i className="fa-solid fa-lock"></i>
                                </div>
                                <h3 className="text-lg font-bold font-cinzel text-white mb-2">Admin Authentication</h3>
                                <p className="text-xs text-slate-400 mb-4">Enter Admin Passcode to unlock editing controls (Default: 1234).</p>

                                <form onSubmit={handleAdminLogin} className="space-y-3">
                                    <input 
                                        type="password" 
                                        value={pinInput} 
                                        onChange={(e) => setPinInput(e.target.value)} 
                                        placeholder="Enter PIN" 
                                        autoFocus 
                                        required 
                                        className="w-full bg-cosmic-900 border border-slate-700 rounded-xl px-4 py-2.5 text-center text-lg tracking-widest text-white focus:outline-none focus:border-sky-500"
                                    />
                                    <div className="flex space-x-2 pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowPinModal(false)}
                                            className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-xs font-semibold"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="flex-1 bg-sky-600 hover:bg-sky-500 text-white py-2.5 rounded-xl text-xs font-bold shadow-glow"
                                        >
                                            Unlock
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <footer className="mt-auto py-6 text-center text-xs text-slate-500 border-t border-slate-800/80">
                        <p>© 2026 Tenshi Shinwa Anime Angel Collection. All rights reserved.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
